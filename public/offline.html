<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FCEEDA" />
    <title>Xoot is offline</title>
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; src: url('/fonts/plus-jakarta-sans-latin-var.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      @font-face { font-family: Newsreader; src: url('/fonts/newsreader-latin-var.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      @font-face { font-family: Caveat; src: url('/fonts/caveat-latin-var.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
      :root {
        color-scheme: light;
        --foreground: #151515;
        --muted: #5f5c59;
        --primary: #151515;
        --card: #fff;
        --border: rgba(20, 18, 16, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: linear-gradient(180deg, #FCEEDA 0%, #FCE6DE 52%, #FBE3EC 100%);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: clamp(24px, 6vw, 42px);
        background: var(--card);
        box-shadow: 0 12px 36px rgba(20, 18, 16, 0.07);
      }

      .brand {
        font: 600 45px/1 Caveat, cursive;
        color: #7c5cfc;
      }

      h1 {
        font-family: Newsreader, Georgia, serif;
        font-weight: 400;
        margin: 28px 0 12px;
        font-size: clamp(2.25rem, 12vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      a,
      button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        border: 0;
        border-radius: 999px;
        padding: 0 22px;
        background: var(--primary);
        color: #fffaf4;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Xoot</div>
      <h1>Xoot is offline.</h1>
      <p>Your app shell is still here. Reconnect to refresh bookings, messages, tracking, support updates, and Care+ details. Sensitive access notes are never shown on this offline screen.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
