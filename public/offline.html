<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A2E" />
    <title>Zoot is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf4e8;
        --foreground: #241812;
        --muted: #74645c;
        --primary: #c4674a;
        --card: rgba(255, 255, 255, 0.82);
        --border: rgba(36, 24, 18, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #18100d;
          --foreground: #fbf4eb;
          --muted: #c7b8ad;
          --card: rgba(38, 27, 22, 0.86);
          --border: rgba(251, 244, 235, 0.16);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          linear-gradient(135deg, rgba(196, 103, 74, 0.12), transparent 38%),
          linear-gradient(180deg, var(--background), #f4eadf);
        color: var(--foreground);
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: clamp(24px, 6vw, 42px);
        background: var(--card);
        box-shadow: 0 28px 72px -40px rgba(36, 24, 18, 0.55);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #de9a74);
        color: #fffaf4;
        box-shadow: 0 18px 38px -20px rgba(196, 103, 74, 0.85);
      }

      h1 {
        margin: 28px 0 12px;
        font-size: clamp(2.25rem, 12vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      a,
      button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        border: 0;
        border-radius: 999px;
        padding: 0 22px;
        background: var(--primary);
        color: #fffaf4;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark">Z</span>
        <span>zoot</span>
      </div>
      <h1>Zoot is offline.</h1>
      <p>Your app shell is still here. Reconnect to refresh bookings, messages, tracking, support updates, and Care+ details. Sensitive access notes are never shown on this offline screen.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
