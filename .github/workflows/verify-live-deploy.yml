name: Verify live deploy

# Has Netlify actually published the commit on `main`?
#
# ── Why this workflow exists ────────────────────────────────────────────────────
# `docs/release/go-live.md` §3b: the web app must ship before the two booking writers, and its gate
# is "wait for the Netlify deploy to succeed". Until this existed, that gate was a person looking at
# the site — so in practice it was skipped.
#
# Measured 2026-08-12: the booking functions were dispatched **70 seconds** after the merge to
# `main`. A Netlify build takes minutes, so for a short window the new server charged R39 on a
# recurring booking while the old client still showed R0 — the price under-statement §3b exists to
# prevent, and the Consumer Protection Act problem behind it. Nothing caught it because nothing
# could.
#
# ⚠️ THIS CANNOT BE DONE FROM AN AGENT SESSION, and that is not a preference. Outbound CONNECT to
# `xoot.co.za:443` is refused by the organisation's egress policy — the proxy records it as
# `connect_rejected`, gateway 403 — and `/root/.ccr/README.md` says to report policy denials rather
# than route around them. A GitHub runner has no such restriction. So the check lives here, the same
# reason `twilio-selftest.yml` does.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: >-
          Commit the live site should be serving. Blank uses this workflow's own SHA, which is what
          you want when checking `main` right after a merge.
        required: false
        type: string
  push:
    branches: [main]

  # ── A daily heartbeat, added 2026-09-02 ─────────────────────────────────────────────────────
  #
  # This check only ever ran on a push to `main` or when someone remembered to dispatch it. So the
  # live site was silently wrong for THREE WEEKS: `xoot.co.za` was answering with a GoDaddy Website
  # Builder placeholder while both hosts held correct production builds, and nothing was watching
  # the one thing that would have said so.
  #
  # A deploy check that only runs at deploy time cannot catch the failures that happen between
  # deploys — a DNS change, a certificate lapse, a domain moved to another host, a builder site
  # republished by accident. Those are exactly the failures nobody notices, because the site keeps
  # returning 200.
  #
  # 06:00 UTC is 08:00 SAST — before the working day, so a failure is waiting rather than arriving
  # mid-afternoon. On a scheduled run `github.sha` is main's head, which is the right thing to
  # compare against.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  # One at a time per branch. Two pushes in quick succession would otherwise race, and the older
  # run would fail against a site that has correctly moved on to the newer commit.
  group: verify-live-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Is the live site serving this commit?
    runs-on: ubuntu-latest
    steps:
      - name: Compare the deployed build stamp against this commit
        id: stamp
        env:
          SITE: https://xoot.co.za
          EXPECTED: ${{ inputs.expected_commit || github.sha }}
        shell: bash
        run: |
          #
          # ⚠️ `shell: bash` DOES set `-e`. Measured, on this workflow's first run.
          #
          # `db-push.yml` and `twilio-selftest.yml` both carry a comment claiming `shell: bash`
          # avoids errexit. It does not — GitHub invokes it as
          # `bash --noprofile --norc -e -o pipefail {0}`, which the run log prints verbatim. The
          # only difference from the default is that `-o pipefail` is added.
          #
          # So the first run of this check died after 7 seconds with
          # `printf: write error: Broken pipe`, exit 5: `printf … | jq` gets SIGPIPE when jq closes
          # its input early on non-JSON, pipefail promotes that to a pipeline failure, and `-e`
          # aborts the job. It looked like the live site had failed the check. It had not — the
          # check had.
          #
          # Two fixes, both applied: clear errexit explicitly, and stop piping into jq at all.
          set +e
          set -uo pipefail

          # ⚠️ CORRECTED 2026-09-02. This block used to say "12 attempts, ~10 minutes total" while
          # setting `attempts=12` and `delay=15`, which is 11 sleeps of 15 seconds — **3 minutes**,
          # not 10. Off by more than three times, in the direction that makes the check useless.
          #
          # Netlify's build of this repo takes longer than 3 minutes, so the poll had always given
          # up before the deploy landed, every time, and always down the "no build stamp readable"
          # path below — which exits 0. Measured on the merge of PR #44: the check ran 11:30:56 to
          # 11:33:43 reporting "no build stamp" on all 12 attempts, and Netlify's `currentDeploy`
          # had moved to `6a9808ea` state `ready` shortly after. The site was fine; the window was
          # not.
          #
          # 20 attempts at 30 seconds is ~9.5 minutes — the interval the comment always claimed —
          # with fewer requests than shortening the delay would cost.
          attempts=20
          delay=30
          live=""
          body=""

          echo "expected: $EXPECTED"
          echo "site:     $SITE"
          echo ""

          for attempt in $(seq 1 "$attempts"); do
            body=$(curl -sS --max-time 25 "${SITE}/build-info.json?cachebust=${GITHUB_RUN_ID}-${attempt}" 2>&1)
            # Herestring, not a pipe — see the note above about SIGPIPE killing the job.
            # `|| true` as well as the `set +e` above: jq exits non-zero on invalid JSON, and a
            # 404 HTML page is invalid JSON. Belt and braces, because either one alone failing
            # silently turns "the site is not ready yet" into "the check is broken".
            live=$(jq -r '.commit // ""' <<< "$body" 2>/dev/null || true)

            if [ -n "$live" ] && [ "$live" = "$EXPECTED" ]; then
              echo "attempt ${attempt}: live=${live:0:8} ✅ match"
              {
                echo "## ✅ Live site is serving this commit"
                echo ""
                echo "\`${EXPECTED:0:8}\` — confirmed after ${attempt} attempt(s)."
                echo ""
                echo "§3b's gate is satisfied: it is now safe to dispatch \`create-booking\` and"
                echo "\`create-booking-request\`."
              } >> "$GITHUB_STEP_SUMMARY"
              # Read by the header check below, which is only meaningful once the live site is
              # known to be serving THIS commit. Checking headers on a stale build tells you about
              # a build nobody is shipping.
              echo "serving=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -n "$live" ]; then
              echo "attempt ${attempt}: live=${live:0:8} expected=${EXPECTED:0:8} — not yet"
            # ⚠️ Print the body, not just the verdict. Added 2026-09-02 after a run reported
            # "no build stamp readable" twenty times, and the one thing needed to act on it — what
            # the site actually returned — went only to the step summary, which is not readable
            # from the API. `verify-secrets.yml` and `verify-types.yml` both carry this same lesson
            # in their own comments: a check that reports a verdict without the evidence sends
            # someone to go and find the evidence by hand.
            #
            # Safe to print: a public URL's public response. First and last attempt only, so a slow
            # publish does not paste twenty copies of the same 404 into the log.
            elif [ "$attempt" -eq 1 ] || [ "$attempt" -eq "$attempts" ]; then
              echo "attempt ${attempt}: no build stamp readable yet — first 400 bytes of the response:"
              echo "----- body -----"
              echo "${body:0:400}"
              echo "----- end body -----"
            else
              echo "attempt ${attempt}: no build stamp readable yet"
            fi
            [ "$attempt" -lt "$attempts" ] && sleep "$delay"
          done

          #
          # Out of attempts. Separate the two failures, because the fixes are different and one of
          # them is not a failure at all.
          #
          # ── Is this even our site? Added 2026-09-02, and it should have existed first. ──────
          #
          # For three weeks this check reported "no build stamp" and everyone read it as a slow or
          # broken deploy. It was neither. `https://xoot.co.za` was answering with:
          #
          #   <meta name="generator" content="Starfield Technologies; Go Daddy Website Builder 8.0.0000"/>
          #   <link rel="canonical" href="https://xoot.co.za/404"/>
          #
          # A GoDaddy Website Builder placeholder was published on the apex domain, so DNS never
          # reached Netlify or Vercel at all — while BOTH hosts held correct, current production
          # builds of `main` and both of their APIs happily reported the domain as theirs. A host's
          # own record describes what it would serve if traffic arrived; it says nothing about where
          # DNS sends traffic. That distinction cost three weeks.
          #
          # "Someone else's site is on our domain" is a different failure from "the publish is still
          # running", it needs a different action, and it must not exit 0.
          #
          # Guarded on evidence rather than a guess: a `generator` meta tag that is present and is
          # not ours. Our own build emits no `generator`, so the SPA's index.html cannot trip this —
          # which matters, because that body is the genuine "still publishing" case and must keep
          # warning rather than failing.
          foreign=$(grep -o -i -m1 'name="generator" content="[^"]*"' <<< "$body" || true)
          if [ -n "$foreign" ]; then
            echo "::error::$SITE is being served by something that is not this app: $foreign"
            {
              echo "## 🚨 The domain is serving someone else's site"
              echo ""
              echo "\`$SITE\` returned a page identifying itself as:"
              echo ""
              echo '```'
              echo "$foreign"
              echo '```'
              echo ""
              echo "This is **not** a slow deploy. DNS is not reaching this project. Both hosts can"
              echo "report the domain as theirs and still never receive a request."
              echo ""
              echo "**Fix:** \`docs/release/domain-setup.md\` → *Point the domain at the app*."
              echo "Unpublish the builder site first, or the DNS records will be overwritten."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -z "$live" ]; then
            # No parseable stamp after the full window.
            #
            # ⚠️ The reassurance that used to live here — "most likely fine, the deployed build
            # predates write-build-info.mjs" — is no longer true and was doing real harm. That
            # script has shipped since 2026-08-13 and runs in `postbuild`, so any build published
            # from this repo carries the stamp. Combined with the 3-minute window above, this
            # branch was where every run of this check quietly landed.
            #
            # Still exit 0 rather than fail: a slow publish is not a broken one, and a check that
            # cries wolf on timing gets switched off. But the message no longer tells anyone it is
            # probably fine, because that is the sentence that stopped people looking.
            echo "::warning::No build stamp on $SITE after the full window. Either the publish is still running, or the deployed build did not come from this repository."
            {
              echo "## ➖ No build stamp on the live site"
              echo ""
              echo "\`${SITE}/build-info.json\` did not return a readable \`commit\` within the poll"
              echo "window. **This is not a pass.** Two things it can mean:"
              echo ""
              echo "1. The publish had not finished. Check the deploy log and re-run."
              echo "2. The site is serving a build that did not come from this repository —"
              echo "   \`postbuild\` always writes the stamp, so a build without one is not ours."
              echo ""
              echo "Last response body, truncated:"
              echo ""
              echo '```'
              echo "${body:0:300}"
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "serving=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A stamp, and it is the wrong commit. That is a real answer: Netlify is serving something
          # else. Both SHAs are printed, because "the deploy is stale" is useless without knowing
          # what is actually live.
          echo "::error::Live site is serving ${live} but this commit is ${EXPECTED}. Netlify has not published it within ~10 minutes."
          {
            echo "## ❌ Live site is NOT serving this commit"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| live now | \`${live}\` |"
            echo "| expected | \`${EXPECTED}\` |"
            echo ""
            echo "Netlify has not published this build within ~10 minutes. Check the Netlify deploy"
            echo "log before treating §3b's gate as satisfied — **do not dispatch the booking"
            echo "functions**, because the server would then charge a price the live client does not"
            echo "display."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ── The second half of "is it live", added 2026-09-02 ────────────────────────────────────
      #
      # The check above proves the live site is serving this COMMIT. It says nothing about whether
      # the site is serving it *correctly*, and those are different failures with different causes.
      #
      # `scripts/ops/verify-live-site.mjs` was written on 2026-09-01 to answer the second question
      # — CSP, HSTS, referrer and permissions headers, deep links reaching the SPA instead of a 404,
      # `noindex` on /app /auth /admin, `/.well-known/*` served as JSON rather than rewritten to
      # HTML, a real Supabase URL in the bundle and NO service-role key in it. **Nothing ran it.**
      # It could not run from an agent session either: `xoot.co.za:443` is refused by this
      # organisation's egress policy, so every local invocation returned "I could not look".
      #
      # A GitHub runner has real egress. This is the only place the script can actually answer.
      #
      # The header question matters most on exactly this deploy: `public/_headers` is a Netlify
      # format and `vercel.json` now carries a mirrored copy, so the two hosts can silently drift
      # apart. `assert-static-hosting-security.mjs` compares the two FILES; this reads what the
      # server actually sent.
      - uses: actions/checkout@v5
        if: steps.stamp.outputs.serving == 'true'

      - uses: actions/setup-node@v5
        if: steps.stamp.outputs.serving == 'true'
        with:
          node-version: 22

      - name: The served site must carry its security headers
        if: steps.stamp.outputs.serving == 'true'
        env:
          SITE: https://xoot.co.za
        shell: bash
        run: |
          set +e
          set -uo pipefail

          node scripts/ops/verify-live-site.mjs "$SITE"
          status=$?

          # ⚠️ Exit 2 is not a failing verdict, and collapsing it into one would be the specific
          # mistake this repo keeps making. The script exits 2 when it could not READ the site —
          # a 401, a 403, a refused connection. "I could not look" is not "the site is wrong", and
          # a check that reports the second when it means the first gets muted within a week.
          #
          # Exit 1 is a real verdict: the site answered, and an assertion failed.
          case "$status" in
            0)
              echo "## ✅ Served site passes the header and routing checks" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            2)
              echo "::warning::Could not read $SITE to verify its headers (exit 2). That is an access result, not a verdict on the site."
              {
                echo "## ➖ Could not read the served site"
                echo ""
                echo "Exit 2 means the script could not reach or read \`$SITE\` — not that the"
                echo "site failed. Re-run once it is reachable."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::error::The served site failed its header or routing checks (exit $status)."
              {
                echo "## ❌ Served site failed the header and routing checks"
                echo ""
                echo "The site answered and an assertion failed — see the step log above. This is"
                echo "the class of defect that ships silently on a green build, because"
                echo "\`public/_headers\` is a Netlify format that other hosts ignore without warning."
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
              ;;
          esac
