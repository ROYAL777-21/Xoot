name: CodeQL security analysis

on:
  pull_request:
  push:
    branches: [main, release/xoot-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL security (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze and retain the real SARIF result
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: codeql-results
          upload: never
          upload-database: false
      # A successful analyzer invocation alone does not mean zero findings.
      # Missing/error output and every returned security finding fail this job.
      - name: Exercise result failure controls
        run: node --test scripts/security/assert-codeql-results.test.mjs
      - name: Require a completed analysis with no unresolved findings
        run: node scripts/security/assert-codeql-results.mjs codeql-results
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-security-results
          path: codeql-results/*.sarif
          if-no-files-found: error
