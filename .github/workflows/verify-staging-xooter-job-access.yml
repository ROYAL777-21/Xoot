name: Verify staging Xooter job access

# Independent, read-only role contract check. Never seeds accounts or touches
# production data; uses existing staging-only GitHub secrets.
on:
  pull_request:
    branches:
      - release/xoot-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-and-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Verify approved Xooter and rejected customer JWT on staging
        env:
          XOOT_STAGING_SUPABASE_URL: https://fxmxyabdjqviqbcxmvlp.supabase.co
          XOOT_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.XOOT_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          XOOT_SMOKE_XOOTER_EMAIL: ${{ secrets.XOOT_SMOKE_XOOTER_EMAIL }}
          XOOT_SMOKE_XOOTER_PASSWORD: ${{ secrets.XOOT_SMOKE_XOOTER_PASSWORD }}
          XOOT_SMOKE_CLIENT_EMAIL: ${{ secrets.XOOT_SMOKE_CLIENT_EMAIL }}
          XOOT_SMOKE_CLIENT_PASSWORD: ${{ secrets.XOOT_SMOKE_CLIENT_PASSWORD }}
        run: node scripts/ops/verify-staging-xooter-job-access.mjs
