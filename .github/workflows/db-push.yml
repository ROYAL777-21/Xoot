name: Database migration push

# Runs `supabase db push`, with a dry run first.
#
# WHY THIS EXISTS AND WHY IT DEFAULTS TO DRY RUN
# ----------------------------------------------
# `db push` applies every migration the remote ledger does not have. Until 2026-08-11 that was
# unsafe on this project for a specific reason: production's ledger was missing 23 of the repo's
# 65 versions — not because those migrations had not run, but because production reached the same
# schema through a different path and never recorded the repo's version numbers. A push then would
# have re-run 23 migrations against a live database.
#
# That is fixed. Both ledgers now carry all 65, verified by reading them back. But the first push
# after a reconciliation is exactly the one worth watching, so this defaults to `dry_run: true` and
# will not apply anything until someone deliberately says otherwise.
#
# WHY IT IS A WORKFLOW AND NOT SOMETHING A SESSION RUNS
# -----------------------------------------------------
# `db push` needs a direct Postgres connection, so it needs `SUPABASE_DB_PASSWORD` — which lives in
# Actions secrets and is not available to an agent session. This is the only route, and that is a
# feature: the thing that writes to a production database should leave a run log with a name on it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to push to
        required: true
        default: staging
        type: choice
        options: [staging, production]
      dry_run:
        description: Print the plan without applying it
        required: true
        default: true
        type: boolean
      confirm_project_ref:
        description: >-
          To APPLY to production, type mvlrkelahhsyjrwgsxaf. Ignored for dry runs and staging.
        required: false
        type: string
      repair_orphan_ledger_rows:
        description: >-
          Drop the three redundant 2026-06-30 connector_safe rows from the ledger (staging only).
          Deletes ledger rows; touches no schema. See the block in this file for the evidence.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Two pushes to one database at once is how a half-applied migration happens.
  group: db-push-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  push:
    name: ${{ inputs.dry_run && 'Dry run' || 'APPLY' }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same shape as the deploy workflow: an applying run against production must be typed out in
      # full, so it cannot happen by clicking through a form with defaults.
      - name: Require an explicit confirmation to apply to production
        if: inputs.environment == 'production' && !inputs.dry_run
        env:
          TYPED: ${{ inputs.confirm_project_ref }}
        run: |
          if [ "$TYPED" != "mvlrkelahhsyjrwgsxaf" ]; then
            echo "::error::Applying to production requires confirm_project_ref = mvlrkelahhsyjrwgsxaf. Got: '${TYPED}'"
            exit 1
          fi

      - name: Refuse to run without the credentials this needs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) : ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1 ;;
            *) echo "::error::Not a personal access token. Account -> Access Tokens; starts 'sbp_'."; exit 1 ;;
          esac
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set. db push needs a direct Postgres connection."
            exit 1
          fi
          echo "Credentials present."

      # Pinned for the same reason as the other workflows: resolving `latest` calls the GitHub
      # releases API and a production deploy already failed once on its rate limit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Link and push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ inputs.environment == 'production' && 'mvlrkelahhsyjrwgsxaf' || 'fxmxyabdjqviqbcxmvlp' }}
        # ⚠️ `shell: bash` explicitly, WITHOUT `-e`.
        #
        # GitHub's default for a `run:` block is `bash -e {0}`, and `-e` cannot be cleared from
        # inside the script — `set +e` runs after the shell has already been started with it. That
        # bit this workflow on its first real run: the step died the moment `db push --dry-run`
        # returned non-zero, before a single line of the plan reached the log, and the whole run
        # reported "exit code 1" with nothing to act on.
        #
        # Failure is handled explicitly below, by reading exit codes, which is what a workflow
        # whose entire purpose is to REPORT a plan has to do.
        shell: bash
        run: |
          set -uo pipefail

          # Everything is written twice, on purpose: once to the step summary (readable, formatted,
          # pasteable) and once to the log (readable from the API, which the summary is NOT).
          #
          # This repo has now paid for that distinction three times — `verify-secrets.yml` reported
          # a missing-secret COUNT with the names only in the summary; `verify-types.yml` reported
          # "does not match" with the diff only in the summary; and this workflow reported nothing
          # at all. Each time, the one thing needed to act on the failure was the one thing not in
          # the log.
          #
          # Safe to print: migration version numbers and file names. No data, no credential.
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          both() { tee -a "$GITHUB_STEP_SUMMARY"; }

          if ! supabase link --project-ref "$PROJECT_REF" 2>&1 | both; then
            echo "::error::Could not link to $PROJECT_REF. Check SUPABASE_DB_PASSWORD and the PAT's access."
            exit 1
          fi

          say "## \`db push\` on \`$PROJECT_REF\`"
          say ""

          # ── The orphan ledger rows, and why exactly these three ──────────────────────
          #
          # Measured 2026-08-12. The first honest dry run on staging refused outright:
          #
          #   Remote migration versions not found in local migrations directory.
          #   supabase migration repair --status reverted 20260630155643 20260630155818 20260630160047
          #
          # Those three versions exist in STAGING's ledger and have no file in the repo. They are
          # the `apply_migration` version-rename trap: the MCP stamps its own wall-clock version
          # and ignores the filename, so three separate MCP calls at 15:56, 15:58 and 16:00 landed
          # as three ledger rows, and the capture-to-file step then wrote them as ONE consolidated
          # file — `20260630155159_connector_safe_invoice_zoot_black_schema.sql`, 674 lines.
          #
          # Four things were checked before writing this step, and all four have to hold:
          #
          #   1. PRODUCTION does not have them. Its ledger carries only `20260630155159`. So the
          #      repo, and production, already agree; staging is the odd one out.
          #   2. Every object the three rows create EXISTS in production — `booking_invoices`,
          #      `booking_service_line_items`, `zoot_black_completion_certificates`, `zooters.tier`,
          #      `bookings.zoot_black_requested` — created by the consolidated file.
          #   3. The consolidated file contains each one: the `private` schema, both `zooters`
          #      column adds, the three `bookings` zoot_black columns, and the line-items table
          #      with its `item_key` format constraint.
          #   4. The file is idempotent throughout — 42 `if not exists` / `create or replace`
          #      guards against 33 create statements — so nothing depends on it not re-running.
          #
          # `--status reverted` deletes ledger rows. It runs no SQL against the schema and drops
          # no object. The tables stay exactly where they are; only staging's claim to have applied
          # them under three extra version numbers goes away.
          #
          # ⚠️ Hard-coded, not an input. A free-text "which versions to repair" box on a workflow
          # that edits a migration ledger is a footgun with a nice label. Each orphan needs its own
          # four-point evidence check, and the place to record that is here, in the diff, where
          # someone has to read it before adding a fourth version to the list.
          REPAIRABLE="20260630155643 20260630155818 20260630160047"

          if [ "${{ inputs.repair_orphan_ledger_rows }}" = "true" ]; then
            if [ "$PROJECT_REF" != "fxmxyabdjqviqbcxmvlp" ]; then
              echo "::error::The orphan rows are a staging-only artefact. Production's ledger is already clean — refusing to repair it."
              exit 1
            fi
            say "### Repairing the ledger"
            say ""
            say "Marking as reverted (deletes ledger rows, touches no schema):"
            say ""
            say '```'
            echo "----- migration repair -----"
            # shellcheck disable=SC2086
            supabase migration repair --status reverted $REPAIRABLE 2>&1 | both
            repair_status=${PIPESTATUS[0]}
            say '```'
            echo "----- end (exit $repair_status) -----"
            if [ "$repair_status" -ne 0 ]; then
              echo "::error::Ledger repair failed. Nothing was pushed."
              exit "$repair_status"
            fi
            say ""
          fi

          # Always print what the remote already has. A push that surprises someone is usually a
          # push against a ledger they had not looked at.
          say "### Migrations the remote already records"
          say '```'
          echo "----- migration list -----"
          supabase migration list --linked 2>&1 | tail -100 | both || true
          say '```'

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            say ""
            say "### Dry run — nothing was applied"
            say '```'
            echo "----- db push --dry-run -----"
            supabase db push --dry-run 2>&1 | both
            plan_status=${PIPESTATUS[0]}
            say '```'
            echo "----- end -----"
            if [ "$plan_status" -ne 0 ]; then
              # A dry run that cannot even produce a plan is a real failure and must not be
              # reported as "nothing to do".
              echo "::error::The dry run itself failed (exit $plan_status). The plan above is incomplete."
              exit "$plan_status"
            fi
            echo "Dry run complete. Read the plan above, then re-run with dry_run unchecked to apply."
            exit 0
          fi

          say ""
          say "### Applying"
          say '```'
          echo "----- db push -----"
          supabase db push 2>&1 | both
          status=${PIPESTATUS[0]}
          say '```'
          echo "----- end (exit $status) -----"
          exit "$status"
