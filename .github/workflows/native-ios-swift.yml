name: Native iOS Swift check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-typecheck:
    name: Type-check Live Activities and widgets
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift and SDK versions
        run: |
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Type-check native Swift
        run: bash scripts/ios/typecheck-zoot-live-activities.sh
