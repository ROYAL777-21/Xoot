name: Verify Edge Function secrets

# Answers "did the secrets I set actually land" — the question that has gone wrong repeatedly on
# this project and that nothing could answer from outside the dashboard.
#
# WHY THIS IS SAFE TO RUN AND SAFE TO SHARE
# -----------------------------------------
# `supabase secrets list` prints each secret's NAME and a DIGEST of its value. It never prints the
# value, and this workflow never echoes anything but names and a ✅/❌. The step summary can be
# pasted into an issue or a chat without leaking anything.
#
# It is deliberately not a `secrets list` dump either: the raw output includes digests, which are
# harmless but noisy, and a wall of hex invites someone to paste the wrong thing one day. So the
# job reduces it to the only question worth asking — is each required name present.
#
# WHY IT EXISTS
# -------------
# Supabase never reads a secret back, so "it is set" was previously unverifiable from any session.
# Every Twilio failure on this project has been a secret that was absent, or present under the
# wrong name, and each one cost a round trip of guessing. Measured examples:
#   - `SUPABASE_ACCESS_TOKEN` held a project API key for days; five deploy runs died on it.
#   - `TWILIO_AUTH_TOKEN` and `TWILIO_WEBHOOK_AUTH_TOKEN` are the same Twilio value under two
#     names, and the runbook documented only one — five webhooks would have 403'd silently.
# A list of names would have answered both in seconds.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to inspect
        required: true
        default: staging
        type: choice
        options: [staging, production]

# workflow_dispatch only, and it inspects live provider state. Queue rather than abort.
concurrency:
  group: verify-secrets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify secrets on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same shape guard as the deploy workflow: a wrong token here fails in seconds with an error
      # that names the fix, rather than a confusing CLI message further down.
      - name: Refuse to run without a usable token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "Token present and correctly shaped." ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1 ;;
            *) echo "::error::Not a personal access token. Account -> Access Tokens; starts 'sbp_'."; exit 1 ;;
          esac

      # Pinned, not `latest`. Resolving `latest` makes `setup-cli` call the GitHub releases API,
      # which is rate-limited on shared runners — a production deploy failed on
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded" before it had done
      # anything. A pinned version needs no lookup, so the deploy no longer depends on someone
      # else's API quota. Bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: List secret names and compare against what the code requires
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.environment == 'production' && 'mvlrkelahhsyjrwgsxaf' || 'fxmxyabdjqviqbcxmvlp' }}
        run: |
          set -uo pipefail

          # Names only. `cut` on the first column drops the digest before it ever reaches a log.
          supabase secrets list --project-ref "$PROJECT_REF" \
            | awk 'NR>2 {print $1}' | grep -E '^[A-Z0-9_]+$' | sort -u > /tmp/present.txt || true

          echo "## Secrets on \`$PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Names only — no values, no digests. Safe to share." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          missing=0
          missing_names=""
          check() {
            # Any one of the given names satisfies the requirement, for secrets this repo reads
            # under more than one name (the Twilio account Auth Token).
            for name in $@; do
              if grep -qx "$name" /tmp/present.txt; then
                echo "| \`$1\` | ✅ set |" >> "$GITHUB_STEP_SUMMARY"
                echo "  ✅ $1"
                return 0
              fi
            done
            echo "| \`$1\` | ❌ **MISSING** |" >> "$GITHUB_STEP_SUMMARY"
            # Also to the log, and by NAME. The first run of this workflow reported "2 required
            # secret(s) missing" and nothing else, because the ✅/❌ table went only to the step
            # summary — so the one question it exists to answer still needed a human to open a
            # web page. A count is not an answer. Names are safe: this is the variable name, never
            # its value, and the whole design is that no value ever reaches a log.
            echo "  ❌ $1  MISSING"
            missing=$((missing + 1))
            missing_names="$missing_names $1"
          }

          echo "### In-app voice + chat — no phone numbers needed" >> "$GITHUB_STEP_SUMMARY"
          echo "| secret | status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          check TWILIO_ACCOUNT_SID
          check TWILIO_API_KEY_SID
          check TWILIO_API_KEY_SECRET
          check TWILIO_VOICE_APP_SID
          check TWILIO_CONVERSATIONS_SERVICE_SID
          check TWILIO_WEBHOOK_AUTH_TOKEN TWILIO_AUTH_TOKEN

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Gate codes" >> "$GITHUB_STEP_SUMMARY"
          echo "| secret | status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          check ENCRYPTION_KEY

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Optional — masked PSTN only, costs money per number" >> "$GITHUB_STEP_SUMMARY"
          echo "| secret | status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for name in TWILIO_PROXY_SERVICE_SID TWILIO_CALLER_ID; do
            if grep -qx "$name" /tmp/present.txt; then
              echo "| \`$name\` | set |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | not set — fine unless you want the phone fallback |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "**$missing required secret(s) missing.** Set them, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing on $PROJECT_REF:$missing_names"
            exit 1
          fi
          echo "**All required secrets are present.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Presence is not correctness: a secret set to the wrong value looks identical here." >> "$GITHUB_STEP_SUMMARY"
          echo "The behavioural check is \`go-live.md\` §2c gate 1." >> "$GITHUB_STEP_SUMMARY"
