name: Twilio self-test

# Asks Twilio whether voice and chat are actually configured, and prints the answer.
#
# WHY THIS EXISTS
# ---------------
# `verify-secrets.yml` proves a secret is PRESENT. It cannot prove the value is right, and the most
# likely failure on this project is exactly a present-but-wrong value: a TwiML App whose Voice
# Request URL was never filled in. The SID verifies ✅, `twilio-token` mints a token happily, the
# call button appears — and the call dies silently at the moment two people are trying to speak,
# because Twilio has nowhere to fetch TwiML from.
#
# `twilio-selftest` catches that by asking Twilio. The problem was reaching it: the function is
# admin-only, so answering "does Twilio work" required a human to sign in and click something. The
# question kept being asked and kept being answered with "I cannot check".
#
# WHY IT NEEDS NO NEW SECRET
# --------------------------
# `supabase projects api-keys --reveal` returns a project's keys given only the account personal
# access token, which is already a repository secret. So this job fetches the service-role key at
# run time and calls the function with it. Nothing new to store, nothing new to rotate.
#
# The key is written to a step output? No — it is held in a shell variable inside a single step,
# passed to curl in a header, and never echoed. `set +x` is on by default; there is no `echo "$KEY"`
# anywhere below, and the response is filtered through `jq` rather than dumped, so a future change
# to the function cannot start printing something it should not.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to test
        required: true
        default: production
        type: choice
        options: [production, staging, both]

permissions:
  contents: read

jobs:
  selftest:
    name: Twilio self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to run without a usable token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "Token present and correctly shaped." ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1 ;;
            *) echo "::error::Not a personal access token. Account -> Access Tokens; starts 'sbp_'."; exit 1 ;;
          esac

      # Pinned for the same reason as every other workflow here: resolving `latest` calls the
      # GitHub releases API and a production deploy already failed once on its rate limit.
      #
      # ⚠️ PINNING DOES NOT MAKE THIS STEP RELIABLE, and 2026-08-12 proved it. The action still
      # downloads the release asset, and GitHub's release CDN returned 503 for a stretch that
      # afternoon:
      #
      #     Unexpected HTTP response: 503
      #     Waiting 10 seconds before trying again
      #     Unexpected HTTP response: 503
      #     Waiting 20 seconds before trying again
      #     ##[error]socket hang up
      #
      # Two of the action's own retries, then it gives up after ~30 seconds. That one outage took
      # down a `db push` on production and a self-test run, and each surfaced as a DIFFERENT
      # confusing symptom — a migration that silently did not apply, and a Twilio check that
      # reported nothing. Neither looked like "GitHub was down".
      #
      # So it is worth naming: **a step that fails HERE means nothing about Supabase, Twilio or
      # this repository.** Read the log for `503` or `socket hang up` before investigating
      # anything else, and just re-run.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Run the self-test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        # No `-e`, for the same reason as `db-push.yml`: a reporting workflow that dies on the
        # first non-zero exit reports nothing, which is the failure mode it exists to prevent.
        shell: bash
        run: |
          set -uo pipefail

          run_one() {
            local label="$1" ref="$2"

            echo "## Twilio self-test — $label (\`$ref\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # The secret keys, fetched and used in headers, never printed. `--experimental` is
            # required by the CLI for this command; `-o json` keeps the parse deterministic.
            #
            # ⚠️ EVERY secret key, not just the one named `service_role`. Measured 2026-08-12: the
            # first run of this path got `authentication required` from both projects, because
            # Supabase is midway through a key migration and `api-keys` can return the modern
            # `sb_secret_…` key while the Edge Function's `SUPABASE_SERVICE_ROLE_KEY` env var still
            # holds the legacy JWT. Picking one name and hoping is how that produced a failure that
            # looked like a Twilio problem.
            #
            # So: collect the candidates, try each, stop at the first that authenticates — but as
            # PAIRS, not as loose keys. See the block below; that distinction is the fix.
            local raw
            raw=$(supabase projects api-keys --project-ref "$ref" --experimental -o json 2>/dev/null)

            # ⚠️ The KEY NAMES, printed. Not the values — the names, which is exactly the thing
            # every failed attempt so far has been missing.
            #
            # Measured 17:15: `[eyJ… -> authentication required] [sb_… -> Invalid API key]`, which
            # was read at the time as the filter below leaking the **anon** JWT because `.name` was
            # the wrong field. ⚠️ THAT READING WAS WRONG, and it is left recorded here because it
            # cost a round trip: the schema this step prints shows `.name` IS the field, and the
            # `eyJ` candidate IS `service_role`. `authentication required` came from the gateway
            # rejecting a legacy JWT under `verify_jwt = true`, not from the wrong key being
            # picked. The filter was never the bug.
            #
            # The printout stays anyway — it is what settled the question, and it is the line that
            # will settle the next one. All of it is metadata; `api_key` is never echoed.
            echo "  api-keys schema for $label: $(echo "$raw" | jq -rc '(.[0] // {}) | keys' 2>/dev/null)"
            echo "  api-keys labels for $label: $(echo "$raw" | jq -rc '[.[] | {name, type, id, description} | with_entries(select(.value != null))]' 2>/dev/null | head -c 300)"

            #
            # ⚠️ BOTH HEADERS MUST COME FROM THE SAME KEY SCHEME. THIS IS THE WHOLE PROBLEM.
            #
            # A request to an Edge Function carries two credentials, and they are checked by two
            # different things:
            #
            #   `apikey:`               → the gateway, which asks "is this a key for this project?"
            #   `Authorization: Bearer` → this function, which compares it in full against its own
            #                             service-role env var.
            #
            # These projects each carry FOUR keys — a legacy pair (`anon` / `service_role`, both
            # `eyJ…` JWTs) and a new-scheme pair (`sb_publishable_…` / `sb_secret_…`) — and the
            # gateway rejects a request that mixes them with `{"message":"Conflicting API keys"}`.
            # Measured 19:13, both projects, after the previous two fixes had already landed.
            #
            # So the candidates are not four keys to try in some order. They are TWO PAIRS, and a
            # pair is used whole or not at all. Every earlier attempt failed by taking one key from
            # each side of the migration:
            #
            #   19:06  apikey=sb_secret       auth=sb_secret       → Invalid API key (secret is not
            #                                                        valid in `apikey` at all)
            #   19:13  apikey=anon (eyJ)      auth=sb_secret       → Conflicting API keys
            #   19:13  apikey=anon (eyJ)      auth=service_role    → reached the function, which
            #                                                        answered `authentication
            #                                                        required` — so its env holds
            #                                                        the NEW secret, not this JWT
            #
            # That last line is the useful one: it proves the platform now injects the new-scheme
            # secret under `SUPABASE_SERVICE_ROLE_KEY`, so the new pair is the one that can work.
            # It is tried first; the legacy pair stays as the fallback for a project that has not
            # migrated, where `anon`/`service_role` is still the only pair that exists.
            local pub_new sec_new pub_legacy sec_legacy
            pub_new=$(echo "$raw" | jq -r 'first(.[] | select((.type // "") == "publishable" and (.api_key // "") != "") | .api_key) // ""')
            sec_new=$(echo "$raw" | jq -r 'first(.[] | select((.type // "") == "secret" and (.api_key // "") != "") | .api_key) // ""')
            pub_legacy=$(echo "$raw" | jq -r 'first(.[] | select((.name // "") == "anon" and (.api_key // "") != "") | .api_key) // ""')
            sec_legacy=$(echo "$raw" | jq -r 'first(.[] | select((.name // "") == "service_role" and (.api_key // "") != "") | .api_key) // ""')

            local schemes=""
            [ -n "$pub_new" ] && [ -n "$sec_new" ] && schemes="new"
            [ -n "$pub_legacy" ] && [ -n "$sec_legacy" ] && schemes="$schemes legacy"

            if [ -z "$schemes" ]; then
              echo "::error::No complete key pair for $ref — publishable/secret and anon/service_role were both incomplete."
              echo "❌ Could not read a usable key pair." >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            echo "  usable key pairs for $label:$(printf ' %s' $schemes)"

            local response="" attempt_notes=""
            local scheme key apikey
            for scheme in $schemes; do
              case "$scheme" in
                new)    apikey="$pub_new";    key="$sec_new" ;;
                legacy) apikey="$pub_legacy"; key="$sec_legacy" ;;
              esac
              # Shapes only — never the values. This is the line that would have named the
              # scheme-mixing in one run instead of three.
              echo "  trying the $scheme pair: apikey=$(printf '%s' "$apikey" | cut -c1-3)… auth=$(printf '%s' "$key" | cut -c1-3)…"
              response=$(curl -sS --max-time 60 \
                -X POST "https://${ref}.supabase.co/functions/v1/twilio-selftest" \
                -H "Authorization: Bearer ${key}" \
                -H "apikey: ${apikey}" \
                -H "Content-Type: application/json" \
                -d '{}')
              if [ "$(echo "$response" | jq -r 'if (.checks | type) == "array" then "yes" else "no" end' 2>/dev/null)" = "yes" ]; then
                echo "  authenticated with the $scheme key pair"
                attempt_notes=""
                break
              fi
              # Scheme plus the platform's own message. Neither is a secret, and naming the pair
              # is what separates "wrong key" from "mixed schemes" — they read identically
              # otherwise, which is how this took three runs.
              attempt_notes="${attempt_notes} [${scheme} pair -> $(echo "$response" | jq -rc '.message // .error // "no message"' 2>/dev/null | head -c 120)]"
            done
            [ -n "$attempt_notes" ] && echo "  every key pair rejected:${attempt_notes}"

            # Fail loudly on a non-JSON body rather than letting jq print "null" for every field,
            # which reads like "everything is unset" instead of "the call did not land".
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "::error::$label returned a non-JSON response (the function may not be deployed)."
              echo "❌ Non-JSON response — is \`twilio-selftest\` deployed to \`$ref\`?" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            # A JSON body with no `checks` array is not "Twilio has problems" — it is the function
            # refusing, or not being deployed at all. The first run of this workflow reported
            # `summary: none / account: unknown` and nothing else, which reads like a broken Twilio
            # account when the real cause was that `twilio-selftest` on both projects predated the
            # service-role auth path and was answering 401.
            #
            # Safe to print: this is the function's own error envelope — `{"error": "..."}` — which
            # by design carries a message and never a credential. Truncated anyway, because an
            # unexpected body should not be pasted wholesale into a log.
            if [ "$(echo "$response" | jq -r 'if (.checks | type) == "array" then "yes" else "no" end')" != "yes" ]; then
              local why
              why=$(echo "$response" | jq -rc '{error, message, msg, code}' | head -c 400)
              echo "::error::$label: the function did not return a checks array. Response: $why"
              {
                echo "❌ \`twilio-selftest\` did not return a checks array."
                echo ""
                echo "\`\`\`"
                echo "$why"
                echo "\`\`\`"
                echo ""
                echo "Usually one of: the function is not deployed to \`$ref\`, or the deployed copy"
                echo "predates the service-role auth path and is rejecting this caller. Deploy it and"
                echo "re-run."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            # ⚠️ Filtered, not dumped. Only these fields ever reach a log. The function is designed
            # never to return a secret, and this is the second lock on that: a future field cannot
            # start appearing in a public run log without someone editing this jq.
            {
              echo "**$(echo "$response" | jq -r '.summary // "no summary"')**"
              echo ""
              echo "Account SID: \`$(echo "$response" | jq -r '.accountSid // "unknown"')\`"
              echo ""
              echo "| check | status | detail |"
              echo "|---|---|---|"
              echo "$response" | jq -r '
                .checks[]? |
                "| \(.name) | \(if .ok == true then "✅" elif .ok == false then "❌" else "➖ n/a" end) | \(.detail | gsub("\\|"; "\\\\|")) |"
              '
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            # And to the log, by name. `verify-secrets.yml` shipped reporting only a count to the
            # step summary, and the summary is not readable from the API — so the one thing needed
            # to act on a failure was the one thing not in the log. Same lesson, applied up front.
            echo "----- $label -----"
            echo "$response" | jq -r '
              "summary: \(.summary // "none")",
              "account: \(.accountSid // "unknown")",
              (.checks[]? | "  \(if .ok == true then "OK  " elif .ok == false then "FAIL" else "n/a " end) \(.name): \(.detail)")
            '

            if [ "$(echo "$response" | jq -r '.ok')" != "true" ]; then
              echo "::error::$label: Twilio self-test reported problems (see the checks above)."
              return 1
            fi
            return 0
          }

          status=0
          case "$ENVIRONMENT" in
            production) run_one production mvlrkelahhsyjrwgsxaf || status=1 ;;
            staging)    run_one staging    fxmxyabdjqviqbcxmvlp || status=1 ;;
            both)
              # Both, and neither short-circuits the other: "production is fine, staging is broken"
              # is a useful answer and a `&&` would hide half of it.
              run_one staging    fxmxyabdjqviqbcxmvlp || status=1
              run_one production mvlrkelahhsyjrwgsxaf || status=1
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> Compare the two Account SIDs above. **They must differ.**" >> "$GITHUB_STEP_SUMMARY"
              echo "> The same SID on both means staging and production share Twilio credentials," >> "$GITHUB_STEP_SUMMARY"
              echo "> which \`SECRETS_INVENTORY.md\` forbids — a staging test call would then bill" >> "$GITHUB_STEP_SUMMARY"
              echo "> and log against the live account." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A green run does **not** prove a call connects. Media has to flow between two" >> "$GITHUB_STEP_SUMMARY"
          echo "browsers for that — see \`docs/release/go-live.md\` §2c." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
