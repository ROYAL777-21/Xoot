name: Tests

# The vitest suite was not run by any workflow before this file existed, so the two
# mobile-* suites had been failing to transform without anything reporting it.
# Lint, build and unit tests now gate every PR.

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# `npm run build` runs `prebuild` -> `config:check`, and validate-public-env.mjs hard-fails
# when CI is set but VITE_APP_ENV is not. The Build step had therefore never once succeeded
# in this workflow — earlier lockfile failures aborted the job before it was reached.
#
# Pinned to development rather than `vars.VITE_APP_ENV || 'development'` (the pattern in
# web-preview.yml), deliberately. This workflow gates every PR and every push to claude/**
# and codex/**, so it has to be hermetic. Inheriting the repo variable would mean that
# setting it to staging or production for a deploy silently makes this gate demand real
# Supabase credentials — validate-public-env.mjs requires them for those two values — and
# every PR would start failing on configuration nobody changed. A build gate should not
# depend on deploy secrets; web-preview.yml already covers the deploy-config path.
env:
  VITE_APP_ENV: development

jobs:
  benefit-concurrency:
    name: Booking benefit transactions (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.6", "17.11"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Disposable runner-only database. Never use application credentials here.
          POSTGRES_PASSWORD: xoot-disposable-test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install isolated PostgreSQL test driver
        run: npm install --prefix "$RUNNER_TEMP/xoot-pg-test" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Prove concurrent benefit writes and permissions
        env:
          XOOT_PG_TEST_INTENT: booking-benefit-locks
          XOOT_PG_MODULE: ${{ runner.temp }}/xoot-pg-test/node_modules/pg/lib/index.js
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: xoot-disposable-test
        run: node scripts/ops/test-booking-benefit-locks.mjs

      - name: Prove notification privileges and publication membership
        env:
          XOOT_PG_TEST_INTENT: notifications-realtime-permissions
          XOOT_PG_MODULE: ${{ runner.temp }}/xoot-pg-test/node_modules/pg/lib/index.js
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: xoot-disposable-test
        run: node scripts/ops/test-notifications-realtime-permissions.mjs

  sql-contracts:
    name: Execute booking and gift SQL contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit

      # Keep the disposable PostgreSQL runtime outside application dependencies.
      # A failed install/import fails this job; these checks must never silently skip.
      - name: Install pinned isolated SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/xoot-sql-validation" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8

      - name: Compare SQL booking quotes with the server contract
        env:
          XOOT_PGLITE_MODULE: ${{ runner.temp }}/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js
        run: npx vitest run --project unit src/lib/booking-quote-sql.test.ts

      - name: Verify gift transaction rollback and access controls
        run: node scripts/ops/verify-gift-order-contract.mjs "$RUNNER_TEMP/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify hardened storage upload paths and role isolation
        run: node scripts/ops/verify-storage-path-contract.mjs "$RUNNER_TEMP/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify active-job checklist mutations and service-only access
        run: node scripts/ops/verify-checklist-state-contract.mjs "$RUNNER_TEMP/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify solo review uniqueness, immutable retry and atomic follow-up
        run: node scripts/ops/verify-visit-review-contract.mjs "$RUNNER_TEMP/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify booking chat retry keys, immutable replay and service-only access
        run: node scripts/ops/verify-booking-chat-contract.mjs "$RUNNER_TEMP/xoot-sql-validation/node_modules/@electric-sql/pglite/dist/index.js"

  test:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      # Required, not optional. src/lib/mobile-*.test.ts import from mobile/src/lib,
      # and Vite's oxc transform resolves the nearest tsconfig per file — which for
      # those is mobile/tsconfig.json, extending `expo/tsconfig.base`. Without this
      # step both suites fail to transform and 8 tests silently do not run.
      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Not redundant with the build. Vite does not typecheck, so this is the only
      # step that catches type regressions — it is what caught the Tailwind v4
      # codemod rewriting Button `variant="outline"` props to `"outline-solid"`,
      # which linted and built clean.
      - name: Typecheck
        run: bun run typecheck

      - name: Native app typecheck
        run: bun run mobile:typecheck

      - name: Native booking contract checks
        run: npm --prefix mobile run test:booking

      # The unit suite includes browser regression tests for startup failures.
      - name: Install Chromium for rendered checks
        run: bunx playwright install --with-deps chromium

      - name: Unit tests
        run: bun run test

      # ⚠️ Added 2026-08-13, because a guard test had never run anywhere.
      #
      # `supabase/functions/_shared/twilio-webhook.test.ts` verifies Twilio's HMAC against their
      # documented request example — the check that stands between this product and accepting forged
      # webhooks. It is written with `Deno.test()` and a `jsr:@std/assert` import, so vitest could
      # never collect it, and nothing else ever invoked `deno test`. It sat in the tree for weeks
      # looking exactly like coverage.
      #
      # This is the failure `CLAUDE.md` names outright: a guard is only worth having if it fails
      # against the defect it describes, and one that is never collected cannot fail at all.
      #
      # `continue-on-error` deliberately: this is the step's first run and the Deno sources import
      # from `esm.sh` at test time. A red gate that nobody asked for gets switched off; an advisory
      # one that reports honestly gets read and then promoted. Remove the flag once it is green.
      #
      # ⚠️ SCOPED TO ONE FILE 2026-08-13, and the reason is the whole point of this step.
      #
      # It was `deno test … supabase/functions/`, which collects EVERY `*.test.ts` under that tree —
      # including `_shared/payfast.test.ts`, which imports from `"vitest"`. Deno cannot resolve that
      # specifier, so the command failed on collection and never reached the Twilio test at all.
      # `continue-on-error: true` then reported the step's conclusion to the API as `success`.
      #
      # So the step added to stop a guard from silently not running was itself a guard silently not
      # running, hidden one layer deeper: green tick, zero assertions executed. Naming the file is
      # what makes the step's success mean the thing its name claims.
      #
      # `payfast.test.ts` is not lost — vitest collects it now that `vitest.config.ts` includes
      # `supabase/functions/**`, and `twilio-webhook.test.ts` is excluded there because it is the
      # Deno-native one. Each file runs under exactly one runner, and neither runner is asked to
      # read the other's dialect.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno tests (advisory on its first outings)
        continue-on-error: true
        run: deno test --allow-net --allow-env supabase/functions/_shared/twilio-webhook.test.ts

      - name: Build
        run: bun run build

      - name: Verify the rendered build
        run: bun run ops:smoke:rendered:artifact

      # Does what is deployed still match what is in this repository?
      #
      # Nothing asked that question until 2026-08-07, and the answer was "no, not one of the 42
      # production functions" — production had been charging a superseded pricing model and
      # serving a retired domain for weeks. Every step above was green throughout, because every
      # step above reads the repo file, and the repo file was correct.
      #
      # Deliberately advisory, not a gate. It needs a live function list to say anything true, and
      # a build workflow must not fail because a deploy is pending or a token is absent — that
      # would train people to ignore it. It reports; a human decides. Exit 1 means drift, exit 2
      # means it could not tell, and both are printed rather than thrown.
      #
      # With no token set the script exits 2 and says so, which `continue-on-error` absorbs — so
      # this is a no-op until SUPABASE_ACCESS_TOKEN exists as a repository secret.
      #
      # The token is deliberately scoped to this one step rather than the workflow `env` block.
      # It is a Supabase *management* credential, and every earlier step runs third-party install
      # scripts; a workflow-level secret would be readable by all of them. It also cannot be
      # tested with a step-level `if`, because the `secrets` context is not available there and
      # `env` set on a step is not visible to that same step's `if` — hence letting the script
      # decide instead of guarding the step.
      - name: Deployed-vs-repo drift (advisory)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ops/check-deployed-drift.mjs
