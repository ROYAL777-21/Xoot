name: Production readiness guard

on:
  push:
    # main only: a `codex/**` glob here fires alongside `pull_request` for the same
    # commit, doubling the cost. Branch coverage comes from the pull-request run.
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# windows-latest bills at 2x. Deliberately NOT path-filtered: this job asserts that documents,
# scripts and migrations agree with each other, so a docs-only change genuinely can break it — that
# is exactly how it broke on 2026-08-13. Cancelling superseded runs is the saving available here.
concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Verify blocker and provider-readiness artifacts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Parse PowerShell ops scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/ops/check-local-provider-auth.ps1',
            'scripts/ops/check-blocker-ledger.ps1',
            'scripts/ops/setup-local-provider-auth.ps1',
            'scripts/ops/deploy-supabase-backend.ps1',
            'scripts/ops/deploy-staging-backend.ps1',
            'scripts/ops/deploy-production-backend.ps1',
            'scripts/ops/set-github-public-vars.ps1',
            'scripts/ops/set-supabase-edge-secrets.ps1',
            'scripts/ops/check-supabase-metadata-drift.ps1',
            'scripts/ops/verify-production-readiness.ps1',
            'scripts/ops/verify-supabase-live.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse failed for $file"
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }

            Write-Host "OK: $file"
          }

      - name: Run offline production-readiness verifier
        shell: pwsh
        run: |
          ./scripts/ops/verify-production-readiness.ps1 -Json

      - name: Check unresolved blocker ledger coverage
        shell: pwsh
        run: |
          ./scripts/ops/check-blocker-ledger.ps1 -Json

      - name: Check Supabase migration metadata drift guardrails
        shell: pwsh
        run: |
          ./scripts/ops/check-supabase-metadata-drift.ps1 -Environment staging -Json
          ./scripts/ops/check-supabase-metadata-drift.ps1 -Environment production -Json

      - name: Run secret and frontend-write guards
        shell: pwsh
        run: |
          node scripts/security/secret-scan.mjs
          node scripts/security/assert-no-frontend-admin-queue-writes.mjs

      - name: Document live-provider checks
        shell: pwsh
        run: |
          Write-Host "Live provider checks are intentionally not run in this workflow."
          Write-Host "Run scripts/ops/verify-production-readiness.ps1 -IncludeExternal -RequireLive only from an authenticated local or controlled ops shell."
