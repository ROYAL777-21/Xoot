name: Verify generated types match the live schema

# Answers "does the committed `types.ts` still describe the real database" — a question that has
# been answered by hand twice on this project, and got it wrong both times.
#
# WHY THIS EXISTS
# ---------------
# `src/integrations/supabase/types.ts` is generated from the live schema. When a migration adds a
# column, someone has to regenerate it. Twice this has instead been hand-edited, because a session
# with no database access needed the schema-contract test to pass:
#
#   - `bookings.commission_rate_bps` and the `xooter_commission_boosts` table were both added by
#     hand on 2026-08-09.
#   - The columns were right. The `Relationships` block was not: it said `[]` when the table has a
#     real foreign key to `zooters`, which the generator renders as **four** entries — `zooters`,
#     `zooters_public`, `booking_zooter_profiles` and `analytics_contractor_quality`. Three of the
#     four are views, so nobody transcribing by hand would think to include them.
#
# A wrong `Relationships` block is not cosmetic: supabase-js uses it to type nested selects, so an
# embedded query that is valid at runtime fails to typecheck, or worse, typechecks and returns
# something other than what the types promised.
#
# Hand-maintaining generated output does not work. This makes the machine do it.
#
# WHY IT IS NOT PART OF THE TEST SUITE
# ------------------------------------
# It needs network access and a Supabase token, so it cannot run in `bun run test`. It runs here,
# where the token already exists as a repository secret — the same one the deploy and secret
# verification workflows use.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to generate from
        required: true
        default: production
        type: choice
        options: [production, staging]
  # On pull requests that touch migrations or the types file, because those are exactly the changes
  # that make the committed file stale.
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/integrations/supabase/types.ts"

permissions:
  contents: read

jobs:
  verify:
    name: Types match the live schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to run without a usable token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "Token present and correctly shaped." ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1 ;;
            *) echo "::error::Not a personal access token. Account -> Access Tokens; starts 'sbp_'."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate from the live schema and diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Production is the default because it is the schema the app actually serves. Staging is
          # selectable for checking a migration before it reaches production.
          PROJECT_REF: ${{ inputs.environment == 'staging' && 'fxmxyabdjqviqbcxmvlp' || 'mvlrkelahhsyjrwgsxaf' }}
        run: |
          set -uo pipefail
          supabase gen types typescript --project-id "$PROJECT_REF" > /tmp/generated.ts

          # A failed generation writes an empty or tiny file. Diffing that against the real one
          # would report thousands of removed lines and read like catastrophic drift, when the
          # actual fault is that the CLI did not run.
          lines=$(wc -l < /tmp/generated.ts)
          if [ "$lines" -lt 100 ]; then
            echo "::error::Type generation produced only $lines lines — the CLI call failed, this is not schema drift."
            exit 1
          fi

          if diff -u src/integrations/supabase/types.ts /tmp/generated.ts > /tmp/types.diff; then
            echo "## Types match \`$PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The committed file is exactly what the live schema generates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Types differ from \`$PROJECT_REF\`"
            echo ""
            echo "Regenerate and commit:"
            echo ""
            echo '```'
            echo "supabase gen types typescript --project-id $PROJECT_REF > src/integrations/supabase/types.ts"
            echo '```'
            echo ""
            echo "<details><summary>Diff</summary>"
            echo ""
            echo '```diff'
            # Bounded: a full schema diff can be thousands of lines and the summary has a size
            # limit, which would truncate mid-block and render as broken markdown.
            head -c 40000 /tmp/types.diff
            echo ""
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Also to the log, not only the step summary. The first run of this workflow reported
          # "does not match — see the job summary", and the summary is not readable from the API,
          # so the one thing needed to act on the failure was the one thing not in the log. Same
          # lesson as `verify-secrets.yml`: a check that reports a verdict without the evidence
          # makes someone go and find the evidence by hand.
          #
          # Safe to print: `types.ts` is generated schema shape — table and column names, already
          # in the repository. It carries no data, no credential and no row.
          # 1200 rather than 300: the first real failure had five hunks and the 300-line cut landed
          # mid-way through the last one, so the diff had to be read twice to see all of it. A
          # truncated diff invites fixing only the visible half and calling it done.
          echo "----- diff (first 1200 lines) -----"
          head -n 1200 /tmp/types.diff
          echo "----- end diff -----"
          echo "diff is $(wc -l < /tmp/types.diff) lines total"
          echo "::error::Committed types.ts does not match $PROJECT_REF — see the diff above."
          exit 1
