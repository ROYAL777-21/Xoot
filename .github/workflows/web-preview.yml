name: Web build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'development' }}
  VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://zoothome.co.za' }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || vars.VITE_PUBLIC_SITE_URL || 'https://zoothome.co.za' }}
  VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_MAPBOX_PUBLIC_TOKEN: ${{ vars.VITE_MAPBOX_PUBLIC_TOKEN }}
  VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ vars.VITE_CLOUDFLARE_TURNSTILE_SITE_KEY }}
  VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
  VITE_APPLE_SERVICES_ID: ${{ vars.VITE_APPLE_SERVICES_ID }}

jobs:
  build:
    name: Install, lint, test, scan, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check lockfiles
        run: node scripts/config/validate-lockfiles.mjs

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Validate public environment
        run: npm run config:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run lightweight secret scan
        run: npm run security:scan

      - name: Validate mobile config
        run: npm run mobile:config:check

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoot-web-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true

      - name: Check deployment environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.VITE_SUPABASE_URL == '' || vars.VITE_SUPABASE_PUBLISHABLE_KEY == '' || vars.VITE_SUPABASE_PROJECT_ID == '')
        run: |
          echo "::notice::GitHub Pages deployment skipped because VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, or VITE_SUPABASE_PROJECT_ID is not configured in repository variables."

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' && vars.VITE_SUPABASE_PROJECT_ID != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' && vars.VITE_SUPABASE_PROJECT_ID != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
