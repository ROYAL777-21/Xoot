name: Verify approved Xoot redesign

# This release gate is independent of PR #46 and does not deploy backend changes.
# It catches a reverted marketing homepage and input/keyboard regressions, in
# addition to the stricter rendered booking/auth smoke from the full GOAL.
on:
  push:
    branches:
      - release/xoot-production
  pull_request:
    branches:
      - release/xoot-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xoot-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Install native/Expo dependencies required by mobile tests
        working-directory: mobile
        run: bun install --frozen-lockfile
      # Vitest includes rendered-site regression tests; browsers must be present
      # BEFORE npx vitest run, not just before the standalone artifact smoke.
      - name: Install Chromium for unit and rendered tests
        run: npx playwright install --with-deps chromium
      - name: Check public/host security configuration
        run: npm run security:scan
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck Expo native booking flow
        run: npm run mobile:typecheck
      - name: Test native booking helpers and deep-link cadence
        run: npm --prefix mobile run test:booking
      - name: Test native gift handoff contracts
        run: npm --prefix mobile run test:gift
      - name: Test native visit detail lifecycle and owner-scoped routing
        run: npm --prefix mobile run test:visit
      - name: Test native Xooter job and earnings account boundaries
        run: npm --prefix mobile run test:xooter
      - name: Lint
        run: npm run lint
      - name: Full web unit test suite
        run: npx vitest run
      - name: Backend readiness check planted-defect tests
        run: node scripts/ops/verify-production-edge-contracts.mjs --self-test
      - name: Build with explicit production environment
        env:
          VITE_APP_ENV: production
        run: npm run build
      - name: Reject legacy site design and keyboard regression
        run: node scripts/ops/verify-approved-design.mjs --artifact dist
      - name: Scan production artifact
        run: npm run build:artifact-scan
