name: Verify approved Xoot redesign

# This release gate is independent of PR #46 and does not deploy backend changes.
# It catches a reverted marketing homepage and input/keyboard regressions, in
# addition to the stricter rendered booking/auth smoke from the full GOAL.
on:
  push:
    branches:
      - release/xoot-production
  pull_request:
    branches:
      - release/xoot-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xoot-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Install native/Expo dependencies required by mobile tests
        working-directory: mobile
        run: bun install --frozen-lockfile
      # Vitest includes rendered-site regression tests; browsers must be present
      # BEFORE npx vitest run, not just before the standalone artifact smoke.
      - name: Install Chromium for unit and rendered tests
        run: npx playwright install --with-deps chromium
      - name: Check public/host security configuration
        run: npm run security:scan
      - name: Test Supabase migration access diagnostics against synthetic failures
        run: node --test scripts/ops/db-push-link-diagnostics.test.mjs
      - name: Test live Mapbox journey acceptance runner refuses unsafe environments
        run: node scripts/ops/verify-live-mapbox-journey.mjs --self-test
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck Expo native booking flow
        run: npm run mobile:typecheck
      - name: Test native booking helpers and deep-link cadence
        run: npm --prefix mobile run test:booking
      - name: Test native gift handoff contracts
        run: npm --prefix mobile run test:gift
      - name: Test native visit detail lifecycle and owner-scoped routing
        run: npm --prefix mobile run test:visit
      - name: Test native Xooter job and earnings account boundaries
        run: npm --prefix mobile run test:xooter
      - name: Test native account privacy and financial integrity
        run: npm --prefix mobile run test:account-finance
      - name: Test native notifications pagination and owner boundaries
        run: npm --prefix mobile run test:notifications
      - name: Test native Xooter Home owner access and SAST scheduling
        run: npm --prefix mobile run test:xooter-home
      - name: Test native Xooter verification and training privacy
        run: npm --prefix mobile run test:xooter-trust
      - name: Test native Xooter Growth and real badge records
        run: npm --prefix mobile run test:growth
      - name: Test native Mapbox attribution and token readiness
        run: npm --prefix mobile run test:maps
      - name: Lint
        run: npm run lint
      - name: Full web unit test suite
        run: npx vitest run
      - name: Backend readiness check planted-defect tests
        run: node scripts/ops/verify-production-edge-contracts.mjs --self-test
      - name: Build with explicit production environment
        env:
          VITE_APP_ENV: production
        run: npm run build
      - name: Reject legacy site design and keyboard regression
        run: node scripts/ops/verify-approved-design.mjs --artifact dist
      - name: Scan production artifact
        run: npm run build:artifact-scan

  referral-client-privileges:
    name: Referral RLS and client privilege hardening (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: xoot-referral-synthetic-test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install isolated pinned PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/xoot-referral-pg" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Prove real client TRUNCATE bypass is fixed and no records are changed
        env:
          XOOT_PG_TEST_INTENT: referral-client-privileges
          XOOT_PG_MODULE: ${{ runner.temp }}/xoot-referral-pg/node_modules/pg/lib/index.js
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: xoot-referral-synthetic-test
        run: node scripts/ops/test-referral-client-privileges.mjs
      - name: Verify production referral prerequisite before ZD035 with real PostgreSQL
        env:
          XOOT_PG_TEST_INTENT: referral-base-prerequisite
          XOOT_PG_MODULE: ${{ runner.temp }}/xoot-referral-pg/node_modules/pg/lib/index.js
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: xoot-referral-synthetic-test
        run: node scripts/ops/test-referral-base-prerequisite.mjs
