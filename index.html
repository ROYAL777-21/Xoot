<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Xoot - Premium home services with trust-first booking workflows</title>
    <meta name="description" content="Book vetted independent Xooters for cleaning, Airbnb, moving, office and premium home care in approved launch suburbs. Care+ supports favourites, recurring schedules, Home Memory and household profiles." />
    <meta name="author" content="Xoot" />
    <link rel="canonical" href="https://xoot.co.za/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/xoot-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      The kit's two webfonts, preloaded because both render above the fold on every route —
      Newsreader in the first heading, Plus Jakarta Sans in everything else. Without this the
      browser only discovers them after parsing the CSS, which is one round trip too late and
      lengthens the swap the fallback metrics in index.css exist to hide.

      `crossorigin` is required even though these are same-origin: fonts are always fetched in
      CORS mode, and a preload without it fetches the file a second time rather than reusing it.

      Preload only what is certain to be used. Adding a third file here would cost bandwidth on
      every route to save a swap on some of them.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/plus-jakarta-sans-latin-var.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/newsreader-latin-var.woff2" />

    <meta name="theme-color" content="#FAF7F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xoot" />

    <meta property="og:title" content="Xoot - Premium home services with trust-first workflows" />
    <meta property="og:description" content="Book vetted independent Xooters for cleaning, Airbnb, moving, office and premium home care in approved launch suburbs." />
    <meta property="og:url" content="https://xoot.co.za/" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://xoot.co.za/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@XootSA" />
    <meta name="twitter:image" content="https://xoot.co.za/og-image.png" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
